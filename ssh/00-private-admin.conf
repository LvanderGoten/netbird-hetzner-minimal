# Example for /etc/ssh/sshd_config.d/00-private-admin.conf
# The Hetzner firewall and NetBird policy provide the network boundary.
# Replace "ops" if your own administrator account has another name.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
AllowUsers ops
AllowAgentForwarding no
AllowTcpForwarding no
X11Forwarding no
